# fly.toml app configuration file generated for otp-soccer on 2026-10-18T13:04:54-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'otp-soccer'
primary_region = 'ewr'

[build]

[env]
  PORT = '3000'
  DATABASE_PATH = '/data/otp.sqlite'

[mounts]
  source = 'otp_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
